<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bank Sync</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=be-vietnam-pro:400,500,600,700|ibm-plex-mono:400,500,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before paint so a saved theme never flashes. The server mirrors the setting to this cookie.
      (() => {
        var match = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);
        if (match) document.documentElement.dataset.theme = match[1];
        var locale = document.cookie.match(/(?:^|;\s*)locale=(vi|en)(?:;|$)/);
        if (locale) document.documentElement.lang = locale[1];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
